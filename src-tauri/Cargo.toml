[package]
name = "dotenvx-gui"
version = "1.2.0"
description = "Local GUI for dotenvx"
authors = ["Toshon Jennings"]
license = "MIT"
repository = "https://github.com/toshonjennings/dotenvx-gui"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dotenvx_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
dirs = "5.0"
tempfile = "3.10"
regex = "1.10"
